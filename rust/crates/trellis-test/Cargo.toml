[package]
name = "trellis-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Private Rust integration-test runtime helper for Trellis."
publish = false

[dependencies]
async-nats.workspace = true
base64.workspace = true
futures-util.workspace = true
nkeys.workspace = true
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile = "3.27.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
toml = "1.1.2"
ulid = "1.2.1"
trellis-local-bootstrap = { path = "../local-bootstrap", version = "0.12.0" }
trellis-local-nats = { path = "../local-nats", version = "0.12.0" }
trellis-protocol.workspace = true
trellis-rs = { path = "../trellis", version = "0.12.0", features = ["test-support"] }
trellis-runtime-apis = { path = "../runtime-apis" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
